<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Ya Kamau - Admin Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Admin Portal</h1>
      <p>Manage your product inventory using direct social media image URLs</p>
      <div class="nav-links">
        <a href="index.html">View Storefront</a> | <a href="admin.html">Admin Portal</a>
      </div>
    </header>

    <main>
      <div class="card">
        <h2 id="formTitle" style="margin-bottom: 16px;">Add New Product</h2>
        <form id="productForm">
          <input type="hidden" id="productId">
          <div class="form-group">
            <label for="productName">Product Name</label>
            <input type="text" id="productName" required placeholder="Enter product name">
          </div>
          <div class="form-group">
            <label for="productPrice">Price (KES)</label>
            <input type="number" id="productPrice" step="0.01" required placeholder="Enter price">
          </div>
          <div class="form-group">
            <label for="productImage">Social Media Image URL</label>
            <input type="url" id="productImage" required placeholder="Paste image URL from Instagram, Facebook, etc.">
            <small style="color: var(--text-light); display: block; margin-top: 4px;">Paste any direct image link copied from your social media handles (supports all formats: .jpg, .png, .webp, dynamic URLs).</small>
          </div>
          <div class="form-group">
            <label for="productDescription">Description</label>
            <textarea id="productDescription" rows="3" placeholder="Enter product description"></textarea>
          </div>
          <button type="submit" id="saveBtn">Add Product</button>
          <button type="button" id="cancelBtn" class="danger" style="display: none; margin-left: 10px;">Cancel Edit</button>
        </form>
      </div>

      <div class="card">
        <h2>Existing Products Inventory</h2>
        <div id="adminProductGrid" class="product-grid" style="margin-top: 20px;">
          <!-- Admin products list will load here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase SDK scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
